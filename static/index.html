<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tele Feed — Deeplink</title>
  <style>
    :root {
      --bg: #0e1621;
      --panel: #17212b;
      --bubble-in: #182533;
      --bubble-out: #2b5278;
      --text: #f5f5f5;
      --muted: #8ba0b4;
      --accent: #6ab2f2;
      --line: #242f3d;
      --deeplink: #7ee787;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .shell {
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .topbar {
      flex-shrink: 0;
      background: var(--panel);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .status { font-size: 12px; color: var(--muted); }
    .status.ok { color: var(--deeplink); }
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 92%;
      padding: 8px 12px 6px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .msg .body { white-space: pre-wrap; }
    .msg.in { align-self: flex-start; background: var(--bubble-in); }
    .msg.out { align-self: flex-end; background: var(--bubble-out); }
    .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .deeplink-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .deeplink {
      display: block;
      color: var(--deeplink);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
      word-break: break-all;
      cursor: pointer;
      pointer-events: auto;
    }
    .deeplink:hover { color: #b7f5bc; }
    .decode-note { color: var(--muted); font-size: 12px; }
    .body a { color: var(--accent); text-decoration: none; }
    .body a:hover { text-decoration: underline; }
    .body code, .body pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .body blockquote { margin: 4px 0; padding-left: 8px; border-left: 2px solid var(--accent); }
    .shell { position: relative; }
    .to-bottom {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .to-bottom.show { display: flex; }
    .to-bottom:hover { background: var(--bubble-in); }
    .to-bottom .badge {
      position: absolute;
      top: -6px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--accent);
      color: #0e1621;
      font-size: 11px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
    }
    .to-bottom .badge:empty { display: none; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 14px;
    }
    .logout {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .logout:hover { color: var(--text); }
    .login-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 18, 0.72);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }
    .login-mask.show { display: flex; }
    .login-card {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 18px 16px;
    }
    .login-card h2 { margin: 0 0 6px; font-size: 18px; }
    .login-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .login-card label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .login-card input {
      width: 100%;
      margin-bottom: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .login-card button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--bubble-out);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .login-error { min-height: 18px; color: #ff8a80; font-size: 12px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <div id="loginMask" class="login-mask">
    <form id="loginForm" class="login-card">
      <h2>Đăng nhập feed</h2>
      <p>JWT token — chỉ gửi tin khi có 1 client WebSocket.</p>
      <label for="username">Tài khoản</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Nhận token</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 id="title">Feed nhóm</h1>
        <div id="status" class="status">Đang kết nối…</div>
      </div>
      <button id="logoutBtn" class="logout" type="button">Đăng xuất</button>
    </header>
    <main id="messages" class="messages">
      <div class="empty" id="empty">Đang chờ Telethon…</div>
    </main>
    <button id="toBottom" class="to-bottom" type="button" title="Xuống tin mới nhất">↓<span id="newCount" class="badge"></span></button>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const emptyEl = document.getElementById('empty');
    const statusEl = document.getElementById('status');
    const loginMask = document.getElementById('loginMask');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const TOKEN_KEY = 'feed_jwt';
    let wsHandle = null;
    const seen = new Set();

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function setToken(token) {
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
    }

    function showLogin(message) {
      if (wsHandle) {
        try { wsHandle.onclose = null; wsHandle.close(); } catch (_) {}
        wsHandle = null;
      }
      loginError.textContent = message || '';
      loginMask.classList.add('show');
      statusEl.textContent = 'Chưa đăng nhập';
      statusEl.classList.remove('ok');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatTime(ms) {
      if (!ms) return '';
      const d = new Date(Number(ms));
      return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function telegramBody(item) {
      if (!item.display_html) return esc(item.text || item.display_text || '');
      const tpl = document.createElement('template');
      tpl.innerHTML = item.display_html;
      tpl.content.querySelectorAll('script,style,iframe,object,embed').forEach((n) => n.remove());
      tpl.content.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((a) => {
          if (a.name.startsWith('on')) el.removeAttribute(a.name);
        });
        if (el.tagName === 'A') {
          const href = el.getAttribute('href') || '';
          if (!/^(https?:|tg:|snssdk1180:)/i.test(href)) el.removeAttribute('href');
          el.setAttribute('target', '_blank');
          el.setAttribute('rel', 'noopener');
        }
      });
      return tpl.innerHTML;
    }

    function renderDeeplinks(item) {
      const links = (item.links || []).filter((l) => l && l.deeplink);
      if (!links.length) return '';
      const rows = links.map((l) => {
        const href = esc(l.deeplink);
        return `<a class="deeplink" href="${href}">${href}</a>`;
      });
      return `<div class="deeplink-row">${rows.join('')}</div>`;
    }

    function itemHtml(item) {
      return `
        <div class="body">${telegramBody(item)}</div>
        <div class="meta">
          <span>${esc(item.chat || '')}</span>
          <span>${esc(item.sender || '')}</span>
          <span>${formatTime(item.timestamp_ms)}</span>
        </div>
        ${renderDeeplinks(item)}
      `;
    }

    const toBottomBtn = document.getElementById('toBottom');
    const newCountEl = document.getElementById('newCount');
    let newCount = 0;

    function atBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
    }

    function updateToBottom() {
      if (atBottom()) newCount = 0;
      newCountEl.textContent = newCount ? (newCount > 99 ? '99+' : String(newCount)) : '';
      toBottomBtn.classList.toggle('show', !atBottom());
    }

    function scrollToLatest(smooth) {
      const gap = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
      const behavior = smooth && gap < messagesEl.clientHeight * 2 ? 'smooth' : 'auto';
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior });
      newCount = 0;
      updateToBottom();
    }

    toBottomBtn.addEventListener('click', () => scrollToLatest(true));
    messagesEl.addEventListener('scroll', updateToBottom, { passive: true });

    function appendItem(item) {
      if (!item || !item.id) return;
      if (emptyEl) emptyEl.remove();
      const existing = messagesEl.querySelector(`[data-id="${CSS.escape(item.id)}"]`);
      if (existing) {
        existing.innerHTML = itemHtml(item);
        updateToBottom();
        return;
      }
      seen.add(item.id);
      const div = document.createElement('div');
      div.className = 'msg ' + (item.outgoing ? 'out' : 'in');
      div.dataset.id = item.id;
      div.innerHTML = itemHtml(item);
      messagesEl.appendChild(div);
      newCount += 1;
      updateToBottom();
    }

    function applyTelethonStatus(st) {
      if (!st) return;
      const phase = st.phase || '';
      if (phase === 'listening') {
        statusEl.textContent = st.message || 'Telethon · đang nghe nhóm';
        statusEl.classList.add('ok');
        const titleEl = document.getElementById('title');
        if (titleEl && st.chats && st.chats.length) {
          titleEl.textContent = st.chats.join(' · ');
        }
        if (emptyEl && emptyEl.isConnected) {
          emptyEl.textContent = st.message || 'Chờ tin mới — chỉ giải mã link trong ~2 phút gửi';
        }
      } else if (phase === 'need_login') {
        statusEl.textContent = 'Chưa login Telethon';
        statusEl.classList.remove('ok');
        if (emptyEl && emptyEl.isConnected) {
          emptyEl.innerHTML = esc(st.message || 'Chạy login_telethon.py trên server') +
            '<br><small style="color:#8ba0b4;margin-top:8px;display:block">Acc +84867493667 · nhóm #‑3431776950</small>';
        }
      } else if (phase === 'no_chats') {
        statusEl.textContent = 'Telethon OK · chưa vào được nhóm';
        statusEl.classList.remove('ok');
        if (emptyEl && emptyEl.isConnected) {
          emptyEl.textContent = st.message || 'Acc chưa có quyền vào nhóm moon_2';
        }
      } else if (st.message) {
        statusEl.textContent = st.message;
      }
    }

    async function pollStatus() {
      const token = getToken();
      if (!token) return;
      try {
        const r = await fetch('/api/status', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (r.status === 401) {
          setToken('');
          showLogin('Phiên hết hạn — đăng nhập lại');
          return;
        }
        if (r.ok) applyTelethonStatus(await r.json());
      } catch (_) {}
    }

    function connect() {
      const token = getToken();
      if (!token) {
        showLogin();
        return;
      }
      loginMask.classList.remove('show');
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
      wsHandle = ws;

      ws.onopen = () => {
        statusEl.textContent = 'WebSocket ✓';
        pollStatus();
      };
      ws.onclose = async () => {
        if (!getToken()) return;
        try {
          const r = await fetch('/api/status', {
            headers: { Authorization: 'Bearer ' + getToken() },
          });
          if (r.status === 401) {
            setToken('');
            showLogin('Token không hợp lệ');
            return;
          }
        } catch (_) {}
        statusEl.textContent = 'Mất kết nối — thử lại…';
        statusEl.classList.remove('ok');
        setTimeout(connect, 2000);
      };
      ws.onerror = () => { ws.close(); };
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.type === 'telethon_status') {
            applyTelethonStatus(data);
            return;
          }
          if (data.type === 'history' && Array.isArray(data.items)) {
            data.items.forEach(appendItem);
            scrollToLatest(false);
            return;
          }
          appendItem(data);
        } catch (_) {}
      };
    }

    loginForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      loginError.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await r.json();
        if (!r.ok || !data.token) {
          loginError.textContent = data.error || 'Đăng nhập thất bại';
          return;
        }
        setToken(data.token);
        connect();
      } catch (_) {
        loginError.textContent = 'Không gọi được máy chủ';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      setToken('');
      showLogin();
    });

    if (getToken()) connect();
    else showLogin();
    setInterval(pollStatus, 8000);
  </script>
</body>
</html>
